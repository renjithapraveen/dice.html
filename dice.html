<!DOCTYPE html>
<html>
    <head>
        <title>Rolling Dice</title>
        <style>
            body{
                text-align: centre;
                font-family: Helvetica, sans-serif;


            }

            #dice{
                font-size: 320px;

            }

            #dice-hover{
                cursor:pointer
            }

        </style>
    </head>

    <div>Click on the Dice...</div>
    <div id="dice" onclick="stopstart()"></div>
    <script>
        var dice;
        // dice image form value 1 to 6 are given in an array, codes are form Die face Emoji Emojipedia
        var dices = ['&#9856;', '&#9857;', '&#9858;', '&#9859;', '&#9860;', '&#9861;'];
        var t;

        function change(){
            var random= Math.floor (Math.random()*6)
            dice.innerHTML= dices[random]

        }

        function stopstart(){
            if (stopped ) {
                stopped= false
                t=setInterval(change,100);
            }else{
                clearInterval(t);
                stopped=true;

            }
        }

        window.onload= function(){
            dice= document.getElementById("dice");
            stopstart();
        }
    </script>
</html>
